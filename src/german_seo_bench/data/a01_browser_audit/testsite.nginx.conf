# Die Auslieferung der Prüflandschaft. Einige Befunde gibt es nur, wenn der
# SERVER etwas tut und nicht nur eine Datei herausgibt:
#
#   cloaked_content   Crawler bekommen anderes HTML als Besucher
#   redirect_chain    eine Adresse führt über zwei Sprünge ans Ziel
#   (Fehlalarm)       eine einzelne, richtige 301 — die KEIN Befund ist
#
# Die Regeln stehen deshalb hier und nicht im Seiten-JavaScript: Genau das ist
# der Unterschied zu `client_side_redirect`, und ein Agent, der beides nicht
# auseinanderhält, soll das an der Wertung merken.

# Was für Suchmaschinen anders ausgeliefert wird. Zwei Zeilen, der SEO-Klassiker.
# `map` gehört in den http-Kontext; `conf.d/*.conf` wird genau dorthin
# eingebunden.
# Wiederkehrer erkennen. Zweite Zeile derselben Bauart wie das Cloaking, nur
# ist die Bedingung hier ein Cookie statt der Kennung — der Klassiker
# „Session-abhängige Auslieferung", an dem sich Crawler mit Cookie-Speicher
# verschlucken.
map $cookie_besuch $wiederkehrer {
    default    "-first";
    "~."       "-again";
}

# Der zweite Zweitbesuch-Schalter, und er hat bewusst einen EIGENEN
# Cookie-Namen. Mit demselben Namen wären die beiden Items nicht unabhängig:
# Wer `archiv.html` zuerst ansieht, bekäme `tipps.html` schon beim ersten
# Aufruf in der Wiederkehrer-Fassung — ein Befund, der dann von der
# Abrufreihenfolge abhängt statt von der Auslieferung.
map $cookie_archiv $archivstand {
    default    "-first";
    "~."       "-again";
}

map $http_user_agent $variant {
    default                        "-visitor";
    "~*googlebot|bingbot|adsbot"   "-bot";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index home.html;

    # Kontextabhängige Auslieferung. Die beiden Fassungen liegen als eigene
    # Dateien, damit `try_files` nicht auf die angeforderte Adresse selbst
    # zurückfällt — das gäbe eine Weiterleitungsschleife. Unter `/preise.html`
    # gibt es folgerichtig KEINE Datei; was dort ausgeliefert wird, entscheidet
    # allein diese Regel.
    #
    # Warum das die Skript-Strategie trifft, ohne eine legitime Technik zu
    # bestrafen: `fetch()` kann den User-Agent nicht setzen — er steht in der
    # Fetch-API auf der Liste der verbotenen Header. Ein Audit, das sich über
    # `fetch(location.href)` selbst misst, kann diesen Befund also nicht sehen.
    # Über die Devtools-Schiene geht es (`emulate` nimmt `userAgent`). Das Item
    # belohnt damit den richtigen Weg, statt den falschen zu sabotieren.
    #
    # `Vary: User-Agent` ist hier keine Feinheit, sondern die Bedingung dafür,
    # dass das Item überhaupt etwas misst. Ohne den Header schreibt der Browser
    # die zuerst geholte Fassung in seinen Cache und liefert sie danach auch
    # dann aus, wenn der Agent den User-Agent längst gewechselt hat — die
    # zweite Anfrage erreicht den Server nie. Ein Agent, der erst alle Seiten
    # als Besucher und danach dieselben als Googlebot holt, bekäme zweimal die
    # Besucher-Fassung und meldete folgerichtig kein Cloaking. Das Item mäße
    # dann nicht SEO-Können, sondern die Reihenfolge der Abrufe.
    #
    # `no-store` zusätzlich, weil `Vary` nur den Schlüssel ändert: Ein Agent,
    # der zweimal mit DERSELBEN Kennung fragt, träfe sonst weiter den Cache und
    # sähe eine Momentaufnahme statt der Auslieferung.
    #
    # Die Cache-Falle, und sie ist Absicht — mit einer Einschränkung, die den
    # Unterschied zwischen Item und Münzwurf ausmacht.
    #
    # ABSICHT: Die Seite variiert nach User-Agent und sendet **kein** `Vary`.
    # Wer sie erst als Besucher holt und danach als Crawler, bekommt aus dem
    # Browser-Cache noch einmal die Besucher-Fassung — die zweite Anfrage
    # erreicht den Server nie. Das ist kein Messfehler, sondern der Fehler, den
    # ein technischer SEO in der Praxis macht: prüfen, eine Bedingung ändern,
    # erneut prüfen und die alte Antwort bekommen. Wer das weiß, fragt
    # unvermittelt nach (`navigate_page` mit `ignoreCache`, `fetch` mit
    # `cache: "reload"`, ein Cache-Buster in der Adresse) oder liest die
    # Serverantwort im Netzwerkprotokoll statt im DOM.
    #
    # EINSCHRÄNKUNG: Ohne expliziten `Cache-Control`-Header entscheidet die
    # HEURISTISCHE Frische, ob der Cache greift — und die rechnet der Browser
    # aus dem Alter der Datei: Bei einige Tage alten Dateien trifft die zweite
    # Anfrage den Cache, bei gerade bearbeiteten geht sie zum Server. Die Falle
    # hinge damit am Auscheckdatum des Repos.
    # Deshalb eine feste Frist, so lang wie ein Lauf höchstens dauert (`TIME_LIMIT`):
    # Der Cache greift überall gleich, und gemessen wird die Gewohnheit des
    # Agenten statt der Uhr.
    location = /preise.html {
        add_header Cache-Control "max-age=7200" always;
        try_files /preise$variant.html =404;
    }

    #
    # Der Zweitbesuch. Beim ersten Abruf setzt der Server ein Cookie und
    # liefert die indexierbare Fassung; beim zweiten Abruf steht ein `noindex`
    # im Kopf. Wer die Seite genau einmal ansieht — und das tut jede
    # `fetch`-Schleife über eine Seitenliste —, sieht davon nichts. Im
    # Quelltext steht die Regel nirgends: Sie steht hier, und diese Datei
    # bekommt kein Agent zu sehen.
    #
    # `no-store` ist hier PFLICHT und damit genau umgekehrt zur gecloakten
    # Seite: Dort soll der Cache zuschlagen (die Falle IST der Cache), hier
    # würde er die Bedingung ersetzen — ein zweiter Abruf käme aus dem Cache,
    # das Cookie käme nie zum Zug, und das Item maße wieder nur die
    # Abrufreihenfolge. Zwei Items, zwei entgegengesetzte Cache-Vorgaben, und
    # beide Male ist die Vorgabe das, was die Bedingung überhaupt messbar
    # macht.
    location = /tipps.html {
        add_header Set-Cookie "besuch=1; Path=/; Max-Age=7200" always;
        add_header Cache-Control "no-store" always;
        try_files /tipps$wiederkehrer.html =404;
    }

    # Der zweite gecloakte Bestand. Dieselbe Bedingung wie bei
    # `preise.html` (die Kennung), aber OHNE die Cache-Falle: hier steht
    # `no-store`. Das trennt zwei Fähigkeiten, die auf `preise.html`
    # zusammenfallen — „wechselt die Kennung überhaupt" und „umgeht dabei den
    # eigenen Cache". Wer nur das Erste kann, holt diesen Befund und den
    # anderen nicht, und die beiden Zahlen im Score sagen dann, woran es lag.
    #
    # Eine explizite Vorgabe ist Pflicht und nicht Geschmack: Ohne
    # `Cache-Control` entscheidet die heuristische Frische, und die rechnet der
    # Browser aus dem Dateialter — dann hinge das Item am Auscheckdatum des
    # Repos (siehe `preise.html`).
    location = /schulen.html {
        add_header Cache-Control "no-store" always;
        try_files /schulen$variant.html =404;
    }

    # Der zweite Zweitbesuch. Gleiches Muster wie `tipps.html`, eigener
    # Cookie-Name, `no-store` aus demselben Grund wie dort.
    location = /archiv.html {
        add_header Set-Cookie "archiv=1; Path=/; Max-Age=7200" always;
        add_header Cache-Control "no-store" always;
        try_files /archiv$archivstand.html =404;
    }

    # Die Falle zum Zweitbesuch: Der Server setzt ein Cookie und liefert
    # trotzdem IMMER dieselbe Datei aus. Wer aus „hier kommt ein Set-Cookie"
    # auf „sitzungsabhängige Auslieferung" schließt, ohne die zweite Antwort
    # mit der ersten zu vergleichen, meldet hier falsch. Das ist der häufigste
    # Kurzschluss bei diesem Befund — ein Cookie ist ein Hinweis, kein Beleg.
    location = /galerie.html {
        add_header Set-Cookie "ansicht=raster; Path=/; Max-Age=7200" always;
        add_header Cache-Control "no-store" always;
        try_files /galerie.html =404;
    }

    # Die Kette: umzug.html -> umzug-zwischen.html -> kategorie.html.
    # Beide Sprünge serverseitig und dauerhaft; keine der beiden Adressen hat
    # eine Datei. Gewertet wird die Kette an ihrem ANFANG (`umzug.html`) — das
    # ist die Adresse, die verlinkt ist und in einem Audit auftaucht.
    location = /umzug.html          { return 301 /umzug-zwischen.html; }
    location = /umzug-zwischen.html { return 301 /kategorie.html; }

    # Die Fehlalarm-Falle dazu: EIN Sprung, serverseitig, dauerhaft, auf eine
    # Seite mit 200. So soll eine Weiterleitung aussehen — kein Befund. Wer
    # jede Weiterleitung meldet, verliert hier Precision.
    location = /shop.html           { return 301 /home.html; }
}
